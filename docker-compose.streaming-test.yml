services:
  postgres:
    image: postgres:18.4-alpine
    restart: "no"
    environment:
      POSTGRES_USER: canopy_stream_test
      POSTGRES_PASSWORD: canopy_stream_test
      POSTGRES_DB: canopy_stream_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy_stream_test -d canopy_stream_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    security_opt:
      - no-new-privileges:true
    networks:
      - stream-test

  nginx:
    image: nginx:stable-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./deploy/nginx/canopy-stream.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CANOPY_STREAM_TEST_MEDIA_ROOT}/library:/srv/canopy/media/library:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - stream-test

networks:
  stream-test:
    driver: bridge
