
server {
    listen 0.0.0.0:8080 default_server;
    server_name _;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /openapi.json {
        alias /srv/canopy/docs/openapi.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location ~ ^/stream/[^/]+$ {
        auth_request /_canopy_auth;
        auth_request_set $canopy_internal_uri $upstream_http_x_accel_redirect;
        auth_request_set $canopy_content_type $upstream_http_x_canopy_content_type;

        try_files /__canopy_never_exists__ $canopy_internal_uri;
        access_log off;
        error_log /dev/null crit;
    }


    location ~ ^/artwork/[^/]+/[^/]+$ {
        auth_request /_canopy_artwork_auth;
        auth_request_set $canopy_internal_uri $upstream_http_x_accel_redirect;
        auth_request_set $canopy_content_type $upstream_http_x_canopy_content_type;

        try_files /__canopy_never_exists__ $canopy_internal_uri;
        add_header Content-Type $canopy_content_type always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        error_log /dev/null crit;
    }


    location = /_canopy_artwork_auth {
        internal;
        proxy_pass http://127.0.0.1:18081/internal/artwork/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Canopy-Original-URI $request_uri;
        access_log off;
        error_log /dev/null crit;
    }

    location = /_canopy_auth {
        internal;
        proxy_pass http://127.0.0.1:18081/internal/stream/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Canopy-Original-URI $request_uri;
        access_log off;
        error_log /dev/null crit;
    }

    location /_canopy_media/ {
        internal;
        alias /srv/canopy/media/library/;
        autoindex off;
        access_log off;
        error_log /dev/null crit;
        add_header Accept-Ranges bytes always;
    }

    location / {
        access_log off;
        return 404;
    }
}
