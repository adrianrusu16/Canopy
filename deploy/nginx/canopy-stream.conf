server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/stream/(?<stream_token>[^/]+)$ {
        auth_request /_canopy_auth;
        auth_request_set $canopy_internal_uri $upstream_http_x_accel_redirect;
        auth_request_set $canopy_content_type $upstream_http_x_canopy_content_type;

        try_files /__canopy_never_exists__ $canopy_internal_uri;
        access_log off;
        error_log /dev/null crit;
    }

    location = /_canopy_auth {
        internal;
        proxy_pass http://host.docker.internal:18081/internal/stream/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Canopy-Stream-Token $stream_token;
        access_log off;
        error_log /dev/null crit;
    }

    location /_canopy_media/ {
        internal;
        alias /srv/canopy/media/library/;
        autoindex off;
        access_log off;
        error_log /dev/null crit;
        add_header Accept-Ranges bytes always;
    }

    location / {
        access_log off;
        return 404;
    }
}
