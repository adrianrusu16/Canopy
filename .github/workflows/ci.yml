name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests --locked -- -D warnings
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test default feature set
        run: cargo test --workspace --locked
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"
      - name: Test PostgreSQL feature set
        run: bash scripts/test-pg.sh
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"
      - name: Test streaming feature set
        run: bash scripts/test-streaming.sh
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
        env:
          CARGO_REGISTRIES_BUF_TOKEN: "Bearer ${{ secrets.BUF_TOKEN }}"
