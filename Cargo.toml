[workspace]
resolver = "2"
members = [
    "crates/canopy-proto",
    "crates/canopy-core",
    "crates/canopy-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Internal crates
canopy-proto = { path = "crates/canopy-proto" }
canopy-core = { path = "crates/canopy-core" }

# Async runtime / RPC
tonic = "0.14.6"
tonic-build = "0.14.6"
prost = "0.14.4"
tokio = { version = "1.38", features = ["full"] }
tonic-prost-build = "0.14.6"
tonic-prost = "0.14.6"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Domain utilities
async-trait = "0.1"
thiserror = "2.0.18"
uuid = { version = "1.6", features = ["v4"] }
ulid = "1.1"

# Cryptography (presigned-URL signing)
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"

# Test utilities
mockall = "0.14.0"
tempfile = "3.10"
