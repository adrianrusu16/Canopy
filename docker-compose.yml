# Canopy — Local Development Environment
#
# This stack provides the full dependency surface for local development and
# integration testing. Services are wired with explicit health checks and
# startup ordering so that the database migrations run only after PostgreSQL
# is actually ready, and the cache layer is up before the backend starts.
#
#   postgres  — metadata persistence (catalog, sessions, playback history)
#   redis     — cache layer (JadeCache: browse results, discovery pools)
#   rustfs    — object storage (audio bytes, artwork, licenses)
#   adminer   — database management UI (optional, dev-only)
#
# To start:
#   docker compose up -d
# To stop:
#   docker compose down
# To wipe all data (⚠️ destructive):
#   docker compose down -v

services:
  postgres:
    # PostgreSQL 18.4 with Alpine for a smaller footprint.
    # Production tuning is applied via command-line options below.
    #
    # Note: PostgreSQL 18+ changed the data directory layout. The mount must
    # be at /var/lib/postgresql (not /var/lib/postgresql/data) so the image
    # can manage version-specific subdirectories for pg_ctlcluster / pg_upgrade.
    image: postgres:18.4-alpine
    container_name: canopy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CANOPY_POSTGRES_USER:-canopy}
      POSTGRES_PASSWORD: ${CANOPY_POSTGRES_PASSWORD:-canopy}
      POSTGRES_DB: ${CANOPY_POSTGRES_DB:-canopy}
    ports:
      - "${CANOPY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - canopy-net
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_completion_target=0.9
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_autovacuum_min_duration=0
      -c autovacuum_max_workers=3
      -c autovacuum_naptime=20s
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    # Redis 8 — used by the JadeCache layer for browse results, discovery
    # pools, and presigned-URL TTL tracking.
    image: redis:8
    container_name: canopy-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${CANOPY_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - canopy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: canopy-rustfs
    restart: unless-stopped
    environment:
      # RustFS configuration (adjust per RustFS docs as they evolve).
      RUSTFS_BUCKET: ${CANOPY_RUSTFS_BUCKET:-pandawave-media}
      RUSTFS_ACCESS_KEY: ${CANOPY_RUSTFS_ACCESS_KEY:-canopy}
      RUSTFS_SECRET_KEY: ${CANOPY_RUSTFS_SECRET_KEY:-canopy-secret}
    ports:
      - "${CANOPY_RUSTFS_PORT:-9000}:9000"
    volumes:
      - rustfs_data:/data
    networks:
      - canopy-net
    healthcheck:
      # RustFS exposes an S3-compatible API; a simple TCP probe is enough
      # until a dedicated health endpoint is documented.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    container_name: canopy-adminer
    restart: unless-stopped
    ports:
      - "${CANOPY_ADMINER_PORT:-8080}:8080"
    networks:
      - canopy-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - adminer
    # Adminer is only started when explicitly requested:
    #   docker compose --profile adminer up -d

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  canopy-net:
    driver: bridge
    name: canopy-net
